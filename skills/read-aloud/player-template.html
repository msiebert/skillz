<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --text: #23211d;
    --muted: #6b665d;
    --border: #e3ded4;
    --accent: #2f5d8a;
    --accent-text: #ffffff;
    --hl-bg: #fde9a8;
    --hl-text: #1f1b10;
    --focus: #1a73e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181b;
      --surface: #202226;
      --text: #e8e6e1;
      --muted: #9b978f;
      --border: #33363c;
      --accent: #7fb0e0;
      --accent-text: #10151a;
      --hl-bg: #5a4a14;
      --hl-text: #fff6d6;
      --focus: #8ab4f8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181b;
    --surface: #202226;
    --text: #e8e6e1;
    --muted: #9b978f;
    --border: #33363c;
    --accent: #7fb0e0;
    --accent-text: #10151a;
    --hl-bg: #5a4a14;
    --hl-text: #fff6d6;
    --focus: #8ab4f8;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 18px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }
  .wrap { max-width: 65ch; margin: 0 auto; padding: 0 16px; }
  header { padding: 32px 0 16px; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 8px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .meta a { color: var(--accent); }
  .notice {
    margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); font-size: 0.9rem;
  }

  .bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 10px 0 0;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .transport { display: flex; align-items: center; gap: 6px; }
  button, select {
    font: inherit; font-size: 0.9rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .step { min-width: 40px; min-height: 40px; }
  .play {
    min-width: 64px; min-height: 52px; font-size: 1.3rem; font-weight: 600;
    background: var(--accent); color: var(--accent-text); border-color: var(--accent);
  }
  .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1 1 200px; }
  .opts label { color: var(--muted); font-size: 0.8rem; display: flex; align-items: center; gap: 4px; }
  #voice { flex: 1 1 140px; min-width: 0; max-width: 100%; }
  .progress { margin-top: 10px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  .status { color: var(--muted); font-size: 0.8rem; padding: 4px 0 6px; }

  main { padding: 24px 0 96px; }
  section { margin-bottom: 32px; }
  h2 { font-size: 1.25rem; line-height: 1.3; margin: 0 0 8px; overflow-wrap: anywhere; }
  p { margin: 0; }
  .s { cursor: pointer; border-radius: 4px; padding: 1px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .s:hover { background: color-mix(in srgb, var(--hl-bg) 40%, transparent); }
  .s.cur { background: var(--hl-bg); color: var(--hl-text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
    <p class="notice" id="notice" hidden>Speech is not supported in this browser. You can still read the script below.</p>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="controls">
      <div class="transport" role="group" aria-label="Playback controls">
        <button class="step" id="prevSec" aria-label="Previous section" title="Previous section (Shift+Left)">&#x23EE;</button>
        <button class="step" id="prev" aria-label="Previous sentence" title="Previous sentence (Left)">&#x23F4;</button>
        <button class="play" id="play" aria-label="Play" title="Play or pause (Space)">&#x25B6;</button>
        <button class="step" id="next" aria-label="Next sentence" title="Next sentence (Right)">&#x23F5;</button>
        <button class="step" id="nextSec" aria-label="Next section" title="Next section (Shift+Right)">&#x23ED;</button>
      </div>
      <div class="opts">
        <label>Speed
          <select id="rate" aria-label="Speech speed">
            <option value="0.8">0.8x</option>
            <option value="1" selected>1x</option>
            <option value="1.15">1.15x</option>
            <option value="1.3">1.3x</option>
            <option value="1.5">1.5x</option>
          </select>
        </label>
        <select id="voice" aria-label="Voice"></select>
        <label><input type="checkbox" id="allVoices"> All languages</label>
      </div>
    </div>
    <div class="progress" aria-hidden="true"><div id="bar"></div></div>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="wrap">
  <main id="script"></main>
</div>

<script>
const SAMPLE_DATA = {
  title: "Sample Listen Page",
  source: "Sample document",
  sourceUrl: "",
  minutes: 1,
  sections: [
    { title: "Overview", sentences: [
      "This is a short sample of the listening player.",
      "It runs about one minute and makes two points.",
      "First, each sentence is spoken on its own. Second, you can click any sentence to jump there."
    ]},
    { title: "How it works", sentences: [
      "The player speaks one sentence at a time.",
      "Pausing remembers where you were and resumes from the start of that sentence.",
      "That is the end of the sample. In short, click play and listen."
    ]}
  ]
};
// The read-aloud skill swaps the placeholder token on the next line for the script JSON.
const DATA = /*SCRIPT_DATA*/SAMPLE_DATA;

(function () {
  const $ = (id) => document.getElementById(id);
  const sections = DATA.sections || [];
  const synth = window.speechSynthesis;
  const supported = !!(synth && window.SpeechSynthesisUtterance);
  const KEY = "read-aloud:" + DATA.title;

  // Persistence (optional)
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ voice: voiceURI, rate: rate, s: pos.s, i: pos.i })); } catch (e) {}
  }
  const saved = load();

  let voices = [];
  let voiceURI = saved.voice || "";
  let rate = [0.8, 1, 1.15, 1.3, 1.5].indexOf(saved.rate) >= 0 ? saved.rate : 1;
  let pos = { s: 0, i: 0 };
  if (Number.isInteger(saved.s) && sections[saved.s] && Number.isInteger(saved.i) && sections[saved.s].sentences[saved.i] !== undefined) {
    pos = { s: saved.s, i: saved.i };
  }
  let playing = false;
  let gen = 0;
  let timer = null;

  // Render
  document.title = DATA.title;
  $("title").textContent = DATA.title;
  const meta = $("meta");
  meta.append("Adapted from ");
  if (DATA.sourceUrl) {
    const a = document.createElement("a");
    a.href = DATA.sourceUrl; a.textContent = DATA.source; a.target = "_blank"; a.rel = "noopener noreferrer";
    meta.append(a);
  } else {
    meta.append(DATA.source || "the original");
  }
  meta.append(" · about " + DATA.minutes + " min listen");

  const spans = [];
  const root = $("script");
  sections.forEach((sec, si) => {
    const el = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = sec.title;
    const p = document.createElement("p");
    spans[si] = [];
    sec.sentences.forEach((text, ii) => {
      const sp = document.createElement("span");
      sp.className = "s";
      sp.textContent = text;
      sp.addEventListener("click", () => seek(si, ii));
      spans[si].push(sp);
      p.append(sp, " ");
    });
    el.append(h, p);
    root.append(el);
  });

  const total = sections.reduce((n, s) => n + s.sentences.length, 0);
  function flatIndex() {
    let n = 0;
    for (let k = 0; k < pos.s; k++) n += sections[k].sentences.length;
    return n + pos.i;
  }

  function highlight(scroll) {
    spans.forEach((row) => row.forEach((sp) => sp.classList.remove("cur")));
    const cur = spans[pos.s] && spans[pos.s][pos.i];
    if (cur) {
      cur.classList.add("cur");
      if (scroll) {
        const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        cur.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
      }
    }
    $("bar").style.width = (total ? ((flatIndex() + 1) / total) * 100 : 0) + "%";
    $("status").textContent = "Section " + (pos.s + 1) + " of " + sections.length +
      " · " + sections[pos.s].title;
    save();
  }

  function setPlayUI() {
    const b = $("play");
    b.innerHTML = playing ? "&#x23F8;" : "&#x25B6;";
    b.setAttribute("aria-label", playing ? "Pause" : "Play");
  }

  // Speech engine
  function stop() {
    gen++;
    clearTimeout(timer);
    if (supported) synth.cancel();
  }

  function speak(text, g, onend) {
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find((x) => x.voiceURI === voiceURI);
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = rate;
    u.onend = () => { if (g === gen) onend(); };
    u.onerror = (e) => {
      if (g !== gen) return;
      if (e.error === "canceled" || e.error === "interrupted") return;
      onend();
    };
    synth.speak(u);
  }

  function step(announce) {
    if (!playing) return;
    const g = gen;
    highlight(true);
    const sayIt = () => speak(sections[pos.s].sentences[pos.i], g, advance);
    if (announce && pos.i === 0) speak(sections[pos.s].title, g, sayIt);
    else sayIt();
  }

  function advance() {
    const g = gen;
    if (pos.i + 1 < sections[pos.s].sentences.length) {
      pos.i++;
      step(false);
    } else if (pos.s + 1 < sections.length) {
      pos = { s: pos.s + 1, i: 0 };
      highlight(true);
      timer = setTimeout(() => { if (g === gen) step(true); }, 600);
    } else {
      playing = false;
      pos = { s: 0, i: 0 };
      setPlayUI();
      highlight(false);
    }
  }

  // Restart from the current position; the short delay avoids Chrome dropping a speak() right after cancel().
  function restart(announce) {
    stop();
    const g = gen;
    timer = setTimeout(() => { if (g === gen) step(announce); }, 40);
  }

  function play() {
    if (!supported || !total) return;
    playing = true;
    setPlayUI();
    restart(true);
  }
  function pause() {
    playing = false;
    stop();
    setPlayUI();
  }
  function toggle() { playing ? pause() : play(); }

  function seek(s, i) {
    pos = { s: s, i: i };
    if (playing) { highlight(true); restart(true); }
    else highlight(true);
  }
  function moveSentence(d) {
    let s = pos.s, i = pos.i + d;
    if (i < 0) { if (s === 0) i = 0; else { s--; i = sections[s].sentences.length - 1; } }
    else if (i >= sections[s].sentences.length) {
      if (s === sections.length - 1) i = sections[s].sentences.length - 1;
      else { s++; i = 0; }
    }
    seek(s, i);
  }
  function moveSection(d) {
    let s = pos.s;
    // Back within a section first jumps to its start.
    if (d < 0 && pos.i > 0) { seek(s, 0); return; }
    s = Math.min(sections.length - 1, Math.max(0, s + d));
    seek(s, 0);
  }

  // Voices
  function score(v) {
    let n = 0;
    if (/premium|enhanced|siri|natural|google/i.test(v.name)) n += 10;
    if (v.localService) n += 3;
    if (/^en[-_]US/i.test(v.lang)) n += 1;
    return n;
  }
  function fillVoices() {
    if (!supported) return;
    voices = synth.getVoices();
    const all = $("allVoices").checked;
    const list = voices.filter((v) => all || /^en/i.test(v.lang))
      .sort((a, b) => score(b) - score(a) || a.name.localeCompare(b.name));
    const sel = $("voice");
    sel.innerHTML = "";
    list.forEach((v) => {
      const o = document.createElement("option");
      o.value = v.voiceURI;
      o.textContent = v.name + " (" + v.lang + ")";
      sel.append(o);
    });
    if (!list.length) return;
    if (!list.some((v) => v.voiceURI === voiceURI)) voiceURI = list[0].voiceURI;
    sel.value = voiceURI;
  }

  // Wiring
  $("play").addEventListener("click", toggle);
  $("prev").addEventListener("click", () => moveSentence(-1));
  $("next").addEventListener("click", () => moveSentence(1));
  $("prevSec").addEventListener("click", () => moveSection(-1));
  $("nextSec").addEventListener("click", () => moveSection(1));
  $("rate").value = String(rate);
  $("rate").addEventListener("change", (e) => {
    rate = parseFloat(e.target.value);
    save();
    if (playing) restart(false);
  });
  $("voice").addEventListener("change", (e) => {
    voiceURI = e.target.value;
    save();
    if (playing) restart(false);
  });
  $("allVoices").addEventListener("change", fillVoices);

  document.addEventListener("keydown", (e) => {
    const t = e.target;
    const tag = t && t.tagName;
    if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === "Space") {
      if (tag === "BUTTON") return;
      e.preventDefault();
      toggle();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      e.shiftKey ? moveSection(1) : moveSentence(1);
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      e.shiftKey ? moveSection(-1) : moveSentence(-1);
    }
  });

  window.addEventListener("pagehide", () => { if (supported) synth.cancel(); });

  if (!supported) {
    $("notice").hidden = false;
    ["play", "prev", "next", "prevSec", "nextSec", "rate", "voice", "allVoices"].forEach((id) => { $(id).disabled = true; });
  } else {
    fillVoices();
    synth.addEventListener("voiceschanged", fillVoices);
  }
  setPlayUI();
  if (sections.length) highlight(false);
})();
</script>
</body>
</html>
